[package]
name = "aws-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }
aws-sdk-s3 = { version = "1", default-features = false }
aws-sdk-ssm = { version = "1", default-features = false }
aws-sdk-sts = { version = "1", default-features = false }
aws-config = { version = "1", default-features = false, features = [
    "behavior-version-latest",
] }
aws-smithy-async = { version = "1", default-features = false, features = [
    "rt-tokio",
] }
aws-smithy-wasm = "0.1"
bytes = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true, features = ["macros", "rt", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing = { version = "0.1" }
wit-bindgen-rt = { version = "0.40", features = ["async", "bitflags"] }

[dev-dependencies]
aws-smithy-http-client = { version = "1", features = ["test-util"] }
aws-smithy-runtime = { version = "1", features = ["client"] }
aws-smithy-runtime-api = { version = "1", features = ["client"] }
aws-smithy-types = "1"
http = "1"

[lib]
crate-type = ["cdylib"]

[[test]]
name = "integration_test"
path = "tests/integration_test.rs"
test = false

[package.metadata.component]
package = "component:aws-cli"

[package.metadata.component.target]
path = "wit/world.wit"

[package.metadata.component.target.dependencies]
"wasi:cli" = "=0.2.11"
"wasi:http" = "=0.2.11"
