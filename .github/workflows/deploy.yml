name: deploy

on:
  workflow_dispatch: {}
  push:
    branches: [main]

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: "www/package.json"

      - name: Install Dependencies
        working-directory: www
        run: npm ci

      - name: Prepare Web Page
        working-directory: www
        run: |
          npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Web Page Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: extension/shell/
      - name: Deploy Web Page
        uses: actions/deploy-pages@v5

      - name: Prepare Extension
        working-directory: www
        run: |
          npm run build:extension
      - name: Package Extension
        id: package_extension
        run: |
          sha_short=$(git rev-parse --short HEAD)
          build_date=$(date -u +%Y-%m-%d)
          build_date_compact=$(date -u +%Y%m%d)
          echo "sha_short=${sha_short}" >> "$GITHUB_OUTPUT"
          echo "build_date=${build_date}" >> "$GITHUB_OUTPUT"
          echo "build_date_compact=${build_date_compact}" >> "$GITHUB_OUTPUT"
          zip -r "extension-${build_date_compact}-${sha_short}.zip" extension/
      - name: Upload Extension Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: extension-${{ steps.package_extension.outputs.build_date_compact }}-${{ steps.package_extension.outputs.sha_short }}
        run: |
          gh release delete "$TAG" --yes || true
          gh release create "$TAG" \
            "extension-${{ steps.package_extension.outputs.build_date_compact }}-${{ steps.package_extension.outputs.sha_short }}.zip" \
            --title "Extension build ${{ steps.package_extension.outputs.build_date }} (${{ steps.package_extension.outputs.sha_short }})" \
            --notes "Automated extension build for commit ${{ github.sha }} on ${{ steps.package_extension.outputs.build_date }}."
