name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: "${{ github.workspace }}/target"
    permissions:
      checks: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Increase swap space
        # A cold cache forces a full rebuild of ~28 aws-sdk-* crates with thin LTO,
        # which can exceed the runner's RAM and get the runner itself killed (exit 143).
        run: |
          sudo swapoff -a
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Cache cargo
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${CARGO_TARGET_DIR}/
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-
      - name: Cache cargo run bin
        uses: actions/cache@v6
        with:
          path: |
            .bin/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.toml') }}

      - name: Install cargo binstall
        uses: cargo-bins/cargo-binstall@v1.28.0
      - name: Install cargo-run-bin
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo binstall cargo-run-bin -y --locked
          cargo bin --install
      - name: Build
        run: |
          CARGO_PROFILE_DEV_LTO=thin cargo component build --target wasm32-wasip2 --workspace --exclude wasi-engine --exclude aws-cli-integration-tests
          cargo build -p wasi-engine
      - name: Upload build outputs
        # Lets the jobs that depend on `build` run the CLI without rebuilding it.
        uses: actions/upload-artifact@v7
        with:
          name: wasi-engine
          path: |
            target/debug/wasi-engine
            target/composed/wasm32-wasip2/debug/aws_cli_composed.wasm
          if-no-files-found: error
          retention-days: 1

      - name: Upload wasm components
        # The wasi-engine build script composes these, so `lint` needs them to compile it.
        uses: actions/upload-artifact@v7
        with:
          name: wasm-components
          path: |
            target/wasm32-wasip2/debug/aws_cli.wasm
            target/wasm32-wasip2/debug/providers_adapter.wasm
          if-no-files-found: error
          retention-days: 1

  # Starts as soon as `build` succeeds and shares its cargo cache, so the workspace
  # dependencies are already compiled. Runs in parallel with `integration-tests`.
  lint:
    needs: build
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: "${{ github.workspace }}/target"
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Increase swap space
        run: |
          sudo swapoff -a
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Download wasm components
        uses: actions/download-artifact@v8
        with:
          name: wasm-components
          path: target/wasm32-wasip2/debug

      - name: Restore cargo cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${CARGO_TARGET_DIR}/
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Check formatting
        run: cargo fmt --all

      - name: Run clippy action to produce annotations
        uses: actions-rs-plus/clippy-check@v2
        with:
          args: --all-targets --all-features --no-deps
          token: ${{ secrets.GITHUB_TOKEN }}
          use-cross: false

  # Starts as soon as `build` succeeds and runs the composed component it produced against
  # the AWS emulator. aws-cli-integration-tests has no dependencies and shells out to the
  # wasi-engine binary, so this job never compiles aws-cli or its aws-sdk-* dependency tree.
  integration-tests:
    needs: build
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: "${{ github.workspace }}/target"
    steps:
      - uses: actions/checkout@v7

      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          name: wasi-engine
          path: target

      - name: Make wasi-engine executable
        # Artifacts do not keep file permissions.
        run: chmod +x target/debug/wasi-engine

      - name: Start AWS emulator
        # Sets AWS_ENDPOINT_URL, AWS_CA_BUNDLE, AWS_SHARED_CREDENTIALS_FILE and the region
        # for the following steps.
        uses: xSAVIKx/run-aws-emulator@v1

      - name: Test the composed WASM component against the AWS emulator
        run: |
          export RUST_LOG="trace,cranelift_codegen=off,cranelift_wasm=off,wasmtime_cranelift=off"
          cargo test -p aws-cli-integration-tests

  # Starts as soon as `build` succeeds, in parallel with `lint` and `integration-tests`.
  # aws-cli's unit tests use tokio's real (non-wasm) runtime via #[tokio::test], so they
  # compile the full aws-sdk-* dependency tree for the host target. That compile is kept in
  # its own cache so that `build` stays short.
  unit-tests:
    needs: build
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: "${{ github.workspace }}/target"
    steps:
      - uses: actions/checkout@v7

      - name: Increase swap space
        run: |
          sudo swapoff -a
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Cache cargo
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${CARGO_TARGET_DIR}/
          key: ${{ runner.os }}-cargo-unit-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-unit-
            ${{ runner.os }}-cargo-build-
      - name: Cache cargo run bin
        uses: actions/cache@v6
        with:
          path: |
            .bin/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.toml') }}

      - name: Install cargo binstall
        uses: cargo-bins/cargo-binstall@v1.28.0
      - name: Install cargo-run-bin
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo binstall cargo-run-bin -y --locked
          cargo bin --install

      - name: Run unit tests
        run: |
          export RUST_TEST_NOCAPTURE=1
          cargo test -p aws-cli --lib
          cargo test -p simple-http-proxy --target wasm32-wasip2

  # Runs in parallel with the `build` job (no `needs:`, so both start
  # together). The transpiled JS bindings under
  # www/aws-cli/component and www/coreutils/component (including the release-profile
  # target/wasm32-wasip2/release/coreutils.wasm they're generated from) are committed
  # to the repo, so this job just checks them out as-is and exercises them end-to-end
  # in a real browser via Playwright - no Rust toolchain/build needed.
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: "www/package.json"
          cache: "npm"
          cache-dependency-path: "www/package-lock.json"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run Playwright e2e tests
        # webkit is excluded here - see frontend-tests-webkit below.
        run: npx playwright test --project=chromium --project=firefox

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: www/playwright-report/
          retention-days: 14

  # Linux runners only have WebKitGTK, a different (and less complete) engine
  # from Apple's actual WebKit that Safari ships - it doesn't support the
  # OPFS/component-model behavior this app depends on, so it can't stand in
  # for Safari here. Playwright's "webkit" build is the real WebKit only on
  # macOS, so this job runs there instead of alongside chromium/firefox above.
  frontend-tests-webkit:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: "www/package.json"
          cache: "npm"
          cache-dependency-path: "www/package-lock.json"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps webkit

      - name: Run Playwright e2e tests
        run: npx playwright test --project=webkit

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-webkit
          path: www/playwright-report/
          retention-days: 14

  pr-success:
    needs:
      - build
      - lint
      - integration-tests
      - unit-tests
      - frontend-tests
      - frontend-tests-webkit
    # if pr-success is skipped, GH branch protection will not consider it a failure, we need to check the result of each dependency ourself
    # see: https://brunoscheufler.com/blog/2022-04-09-the-required-github-status-check-that-wasnt
    if: always()
    steps:
      - if: needs.build.result == 'failure' || needs.lint.result == 'failure' || needs.integration-tests.result == 'failure' || needs.unit-tests.result == 'failure' || needs.frontend-tests.result == 'failure' || needs.frontend-tests-webkit.result == 'failure'
        run: echo "a required job failed, setting the failure() bit" && exit 1
      - if: success()
        run: echo "all dependencies succeeded"
    runs-on: ubuntu-latest
