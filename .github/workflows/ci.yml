name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: "${{ github.workspace }}/target"
    permissions:
      checks: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Increase swap space
        # A cold cache forces a full rebuild of ~28 aws-sdk-* crates with thin LTO,
        # which can exceed the runner's RAM and get the runner itself killed (exit 143).
        run: |
          sudo swapoff -a
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Cache cargo
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${CARGO_TARGET_DIR}/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Cache cargo run bin
        uses: actions/cache@v5
        with:
          path: |
            .bin/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.toml') }}

      - name: Install cargo binstall
        uses: cargo-bins/cargo-binstall@v1.20.1
      - name: Install cargo-run-bin
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo binstall cargo-run-bin -y --locked
          cargo bin --install
      - name: Build
        run: |
          CARGO_PROFILE_DEV_LTO=thin cargo component build --target wasm32-wasip2 --workspace --exclude wasi-engine
          cargo build -p wasi-engine
      - name: Check formatting
        run: cargo fmt --all
      - name: Run clippy action to produce annotations
        uses: actions-rs-plus/clippy-check@v2
        with:
          args: --all-targets --all-features --no-deps
          token: ${{ secrets.GITHUB_TOKEN }}
          use-cross: false

      - name: Test WebAssembly components
        run: |
          CARGO_PROFILE_DEV_LTO=thin cargo component check --target wasm32-wasip2 --workspace --exclude wasi-engine
          cargo check -p wasi-engine
          export RUST_TEST_NOCAPTURE=1
          cargo test -p aws-cli --lib
          cargo test -p simple-http-proxy --target wasm32-wasip2
          export RUST_LOG="trace,cranelift_codegen=off,cranelift_wasm=off,wasmtime_cranelift=off"
          cargo test -p aws-cli --test integration_test -- --test-threads=2

  # Runs in parallel with the `build` job's "Test WebAssembly components" step
  # (no `needs:`, so both jobs start together). The transpiled JS bindings under
  # www/aws-cli/component and www/coreutils/component (including the release-profile
  # target/wasm32-wasip2/release/coreutils.wasm they're generated from) are committed
  # to the repo, so this job just checks them out as-is and exercises them end-to-end
  # in a real browser via Playwright - no Rust toolchain/build needed.
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: "www/package.json"
          cache: "npm"
          cache-dependency-path: "www/package-lock.json"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: www/playwright-report/
          retention-days: 14

  pr-success:
    needs:
      - build
      - frontend-tests
    # if pr-success is skipped, GH branch protection will not consider it a failure, we need to check the result of each dependency ourself
    # see: https://brunoscheufler.com/blog/2022-04-09-the-required-github-status-check-that-wasnt
    if: always()
    steps:
      - if: needs.build.result == 'failure' || needs.frontend-tests.result == 'failure'
        run: echo "a required job failed, setting the failure() bit" && exit 1
      - if: success()
        run: echo "all dependencies succeeded"
    runs-on: ubuntu-latest
